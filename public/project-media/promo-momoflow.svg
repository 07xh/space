<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#eff8ed"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="80" y="78" font-size="26" fill="#408352" font-weight="600">07XH / MOMO VOCABULARY</text><text x="80" y="223" font-size="95" fill="#15263d" font-weight="700">MomoFlow</text><text x="84" y="312" font-size="45" fill="#3e5067" font-weight="500">今日词表，随通知进入每一天。</text><rect x="1100" y="35" width="420" height="57" rx="28" fill="#ffffff"/><text x="1125" y="72" font-size="23" fill="#408352" font-weight="600">ANDROID</text><rect x="80" y="370" width="850" height="615" rx="28" fill="#fff"/><text x="118" y="427" font-size="38" fill="#17293e" font-weight="700">通知里的单词卡</text><rect x="146" y="515" width="716" height="344" rx="25" fill="#eff8ed"/><text x="184" y="582" font-size="29" fill="#408352" font-weight="600">MomoFlow · 今日复习</text><text x="184" y="665" font-size="65" fill="#24334b" font-weight="700">curiosity</text><text x="184" y="725" font-size="36" fill="#68778a" font-weight="400">n. 好奇心；求知欲</text><rect x="181" y="771" width="186" height="56" rx="15" fill="#fff"/><text x="223" y="810" font-size="27" fill="#408352" font-weight="400">不会</text><rect x="395" y="771" width="186" height="56" rx="15" fill="#fff"/><text x="437" y="810" font-size="27" fill="#408352" font-weight="400">记住</text><rect x="609" y="771" width="186" height="56" rx="15" fill="#fff"/><text x="651" y="810" font-size="27" fill="#408352" font-weight="400">下一词</text><text x="118" y="951" font-size="28" fill="#69778d" font-weight="400">自己的词库 · 自己的节奏 · 数据保存在本机</text><rect x="970" y="370" width="260" height="190" rx="22" fill="#fff"/><text x="990" y="417" font-size="33" fill="#24374c" font-weight="700">今日词表</text><text x="990" y="458" font-size="23" fill="#6a788c" font-weight="400">墨墨 API / 每日同</text><text x="990" y="486" font-size="23" fill="#6a788c" font-weight="400">步</text><rect x="990" y="534" width="30" height="4" rx="2" fill="#408352"/><rect x="1250" y="370" width="260" height="190" rx="22" fill="#fff"/><text x="1270" y="417" font-size="33" fill="#24374c" font-weight="700">通知看词</text><text x="1270" y="458" font-size="23" fill="#6a788c" font-weight="400">单词 / 音标 / 中文</text><text x="1270" y="486" font-size="23" fill="#6a788c" font-weight="400">释义</text><rect x="1270" y="534" width="30" height="4" rx="2" fill="#408352"/><rect x="970" y="581" width="260" height="190" rx="22" fill="#fff"/><text x="990" y="628" font-size="33" fill="#24374c" font-weight="700">离线词典</text><text x="990" y="669" font-size="23" fill="#6a788c" font-weight="400">本地查询 / 词典管</text><text x="990" y="697" font-size="23" fill="#6a788c" font-weight="400">理</text><rect x="990" y="745" width="30" height="4" rx="2" fill="#408352"/><rect x="1250" y="581" width="260" height="190" rx="22" fill="#fff"/><text x="1270" y="628" font-size="33" fill="#24374c" font-weight="700">记忆反馈</text><text x="1270" y="669" font-size="23" fill="#6a788c" font-weight="400">认识 / 模糊 / 忘记</text><rect x="1270" y="745" width="30" height="4" rx="2" fill="#408352"/><rect x="970" y="792" width="260" height="190" rx="22" fill="#fff"/><text x="990" y="839" font-size="33" fill="#24374c" font-weight="700">记录核对</text><text x="990" y="880" font-size="23" fill="#6a788c" font-weight="400">词条状态 / 官方记</text><text x="990" y="908" font-size="23" fill="#6a788c" font-weight="400">录</text><rect x="990" y="956" width="30" height="4" rx="2" fill="#408352"/><rect x="1250" y="792" width="260" height="190" rx="22" fill="#fff"/><text x="1270" y="839" font-size="33" fill="#24374c" font-weight="700">系统体验</text><text x="1270" y="880" font-size="23" fill="#6a788c" font-weight="400">通知交互 / 流体云</text><text x="1270" y="908" font-size="23" fill="#6a788c" font-weight="400">体验</text><rect x="1270" y="956" width="30" height="4" rx="2" fill="#408352"/><rect x="80" y="1030" width="1440" height="119" rx="22" fill="#fff"/><text x="108" y="1078" font-size="28" fill="#34465f" font-weight="600">学习流程：同步词表 → 通知复习 → 记忆反馈 → 核对记录</text><text x="108" y="1121" font-size="25" fill="#708097" font-weight="400">围绕墨墨今日学习，把复习安排融入日常</text><text x="80" y="1181" font-size="22" fill="#7c8998" font-weight="400">07XH SPACE / MOMO VOCABULARY</text></g></svg>