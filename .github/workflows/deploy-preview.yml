name: Deploy Cloudflare Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-space-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == '07xh/space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPACE_SITE_URL: https://07xh-space-preview.pages.dev
      SPACE_WALINE_SERVER_URL: ${{ vars.SPACE_WALINE_SERVER_URL }}
      CI_SKIP_REMOTE_FONTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Validate private Functions before deployment
        if: ${{ hashFiles('functions/**/*.js') != '' }}
        run: |
          node --test tests/preview-admin.test.mjs
          npx --yes wrangler@4 pages functions build functions \
            --outdir /tmp/space-preview-functions-preflight \
            --compatibility-date 2026-11-20
      - name: Ensure preview project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          project_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${project_api}/07xh-space-preview")
          case "$status" in
            200) echo 'Preview project already exists' ;;
            404) curl --fail --silent --show-error --output /dev/null \
              -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"name":"07xh-space-preview","production_branch":"main"}' "$project_api" ;;
            *) echo "::error::Cloudflare project lookup returned HTTP $status"; exit 1 ;;
          esac
      - name: Deploy preview project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=07xh-space-preview --branch=main
      - name: Verify deployed private Functions remain protected
        if: ${{ hashFiles('functions/**/*.js') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://07xh-space-preview.pages.dev'
          for route in /admin '/api/admin/content?kind=posts' '/api/admin/deployment?commit=dddddddddddddddddddddddddddddddddddddddd'; do
            status="$(curl --silent --show-error --max-time 20 \
              --output /tmp/space-preview-route-check.txt \
              --write-out '%{http_code}' "${base}${route}")"
            case "$status" in
              302|303|307|308|401|403|503)
                echo "Protected: GET ${route} returned HTTP ${status}" ;;
              *)
                echo "::error::Private route ${route} returned unsafe HTTP ${status}"
                exit 1 ;;
            esac
          done
          status="$(curl --silent --show-error --max-time 20 -X POST \
            --output /tmp/space-preview-upload-check.txt \
            --write-out '%{http_code}' "${base}/api/admin/upload")"
          case "$status" in
            302|303|307|308|401|403|503)
              echo "Protected: POST /api/admin/upload returned HTTP ${status}" ;;
            *)
              echo "::error::Upload API returned unsafe HTTP ${status}"
              exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 --output /dev/null "${base}/"
