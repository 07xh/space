name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-space-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == '07xh/space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPACE_SITE_URL: https://0701000.xyz
      SPACE_WALINE_SERVER_URL: ${{ vars.SPACE_WALINE_SERVER_URL }}
      CI_SKIP_REMOTE_FONTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and authenticated backend
        run: |
          pnpm check
          node --test tests/preview-admin.test.mjs
      - name: Build static site once
        run: pnpm build
      - name: Compile existing Pages Functions into the Worker
        run: |
          npx --yes wrangler@4 pages functions build functions \
            --outdir .worker-dist \
            --compatibility-date 2026-11-20
          test -s .worker-dist/index.js
      - name: Validate Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir /tmp/space-worker-preflight
      - name: Deploy only to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify deployed private Functions remain protected
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL}" ]; then
            echo "::error::Wrangler did not return the Worker deployment URL"
            exit 1
          fi
          base="${DEPLOYMENT_URL%/}"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "${base}/"
          for route in /admin '/api/admin/content?kind=posts' '/api/admin/deployment?commit=dddddddddddddddddddddddddddddddddddddddd' /api/auth/login; do
            status="$(curl --silent --show-error --max-time 20 --output /tmp/space-worker-private-check.txt --write-out '%{http_code}' "${base}${route}")"
            case "$status" in
              302|303|307|308|401|403|503) echo "Protected GET ${route}: HTTP ${status}" ;;
              *) echo "::error::Unexpected GET ${route}: HTTP ${status}"; exit 1 ;;
            esac
          done
          status="$(curl --silent --show-error --max-time 20 -X POST --output /tmp/space-worker-upload-check.txt --write-out '%{http_code}' "${base}/api/admin/upload")"
          case "$status" in
            302|303|307|308|401|403|503) echo "Protected POST /api/admin/upload: HTTP ${status}" ;;
            *) echo "::error::Upload API returned unexpected HTTP ${status}"; exit 1 ;;
          esac
