name: Verify isolated admin preview on Cloudflare Pages

on:
  push:
    branches: [feat/preview-publishing-admin-20261120]
    paths:
      - "functions/**"
      - "src/lib/preview-admin-auth.js"
      - "tests/preview-admin.test.mjs"
      - ".github/workflows/deploy-admin-acceptance.yml"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-preview-admin-acceptance
  cancel-in-progress: false

jobs:
  deploy-admin-acceptance:
    if: github.repository == '07xh/space' && github.ref == 'refs/heads/feat/preview-publishing-admin-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPACE_SITE_URL: https://admin-acceptance.07xh-space-preview.pages.dev
      SPACE_WALINE_SERVER_URL: ${{ vars.SPACE_WALINE_SERVER_URL }}
      CI_SKIP_REMOTE_FONTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate private backend and Astro
        run: |
          node --test tests/preview-admin.test.mjs
          pnpm check
      - name: Build isolated static preview
        run: pnpm build
      - name: Deploy isolated branch (never main)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=07xh-space-preview --branch=admin-acceptance
      - name: Verify real Cloudflare Functions deny anonymous access
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin-acceptance.07xh-space-preview.pages.dev'
          home_status=''
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --max-time 15 --output /tmp/space-public-body --write-out '%{http_code}' "$base/" || true)"
            case "$status" in
              200|302|303|307|308|401|403) home_status="$status"; break ;;
            esac
            sleep 3
          done
          if [ -z "$home_status" ]; then
            echo "::error::Isolated branch preview did not become reachable"
            exit 1
          fi
          if [ "$home_status" != 200 ]; then
            echo "::notice::Branch preview homepage requires Access (HTTP $home_status). Anonymous probes can verify rejection, not confirm private Function execution; complete authorized login acceptance separately."
          fi
          for route in /admin '/api/admin/content?kind=posts' '/api/admin/deployment?commit=dddddddddddddddddddddddddddddddddddddddd'; do
            status="$(curl --silent --show-error --max-time 20 --output /tmp/space-private-body --write-out '%{http_code}' "$base$route")"
            case "$status" in
              302|303|307|308|401|403|503) echo "Protected GET $route: HTTP $status" ;;
              *) echo "::error::Unsafe admin GET response for $route: HTTP $status"; exit 1 ;;
            esac
          done
          status="$(curl --silent --show-error --max-time 20 -X POST --output /tmp/space-upload-body --write-out '%{http_code}' "$base/api/admin/upload")"
          case "$status" in
            302|303|307|308|401|403|503) echo "Protected POST /api/admin/upload: HTTP $status" ;;
            *) echo "::error::Unsafe upload response: HTTP $status"; exit 1 ;;
          esac
          echo 'PASS: isolated preview rejects anonymous admin requests; authorized login and actual GitHub writes still require separate acceptance'
