name: Validate Workers publishing backend

on:
  pull_request:
    paths:
      - "functions/**"
      - "src/lib/preview-admin-auth.js"
      - "src/content.config.ts"
      - "tests/preview-admin.test.mjs"
      - ".github/workflows/validate-preview-admin.yml"
      - ".github/workflows/deploy-preview.yml"
      - "wrangler.jsonc"
      - "docs/preview-publishing-admin.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check private Pages Functions
        run: |
          node --check functions/admin.js
          node --check functions/api/admin/content.js
          node --check functions/api/admin/deployment.js
          node --check functions/api/admin/upload.js
          node --check src/lib/preview-admin-auth.js
      - name: Verify authorization and GitHub publishing gates
        run: node --test tests/preview-admin.test.mjs
      - name: Compile legacy Pages Functions into Worker without deploying
        run: npx --yes wrangler@4 pages functions build functions --outdir .worker-dist --compatibility-date 2026-11-20
      - name: Local Worker runtime must fail closed without secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '<!doctype html><title>Private Workers runtime smoke</title>' > dist/index.html
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8788 > /tmp/space-worker-runtime.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            code="$(curl -s --max-time 2 -o /tmp/space-public.html -w '%{http_code}' http://127.0.0.1:8788/ || true)"
            if [ "$code" = 200 ]; then ready=1; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/space-worker-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Worker local runtime never started"
            cat /tmp/space-worker-runtime.log
            exit 1
          fi
          for route in /admin '/api/admin/content?kind=posts'; do
            code="$(curl -s --max-time 10 -o /tmp/space-locked.json -w '%{http_code}' "http://127.0.0.1:8788$route")"
            if [ "$code" != 503 ]; then
              echo "Fail-closed guard broken for $route: HTTP $code"
              cat /tmp/space-worker-runtime.log
              exit 1
            fi
            node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("/tmp/space-locked.json","utf8")); if (!String(data.error || "").includes("未配置")) process.exit(1)'
            echo "PASS: $route rejects unconfigured admin access with 503"
          done
          code="$(curl -s -X POST --max-time 10 -o /tmp/space-locked.json -w '%{http_code}' http://127.0.0.1:8788/api/admin/upload)"
          if [ "$code" != 503 ]; then
            echo "Fail-closed guard broken for POST /api/admin/upload: HTTP $code"
            cat /tmp/space-worker-runtime.log
            exit 1
          fi
          echo "PASS: POST /api/admin/upload rejects unconfigured access with 503"
