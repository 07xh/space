name: Validate Space admin authentication

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/github-admin-auth.js"
      - "src/lib/preview-admin-auth.js"
      - "functions/**"
      - "tests/preview-admin.test.mjs"
      - ".github/workflows/auth-validation.yml"

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run existing admin authentication tests
        run: node --test tests/preview-admin.test.mjs
      - name: Validate Cloudflare Pages Functions bundle
        run: npx --yes wrangler@4 pages functions build functions --outdir /tmp/space-auth-functions --compatibility-date 2026-11-20
