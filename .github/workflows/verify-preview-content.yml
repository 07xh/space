name: Verify deployed preview article and project pages

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages preview"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-content:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser audit dependencies
        run: |
          npm install --prefix /tmp/space-playwright --no-save --no-audit playwright@1.56.1
          /tmp/space-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify deployed article and project pages
        env:
          SPACE_PLAYWRIGHT_PATH: /tmp/space-playwright/node_modules/playwright
          SPACE_PREVIEW_URL: https://07xh-space-preview.pages.dev
        run: node tests/deployed-content-smoke.cjs
      - name: Save desktop and mobile page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-preview-content-screenshots
          path: artifacts/deployed-content/
          if-no-files-found: ignore
